# Render the apps' environment files from the vault, and check the backup
# secret's, without a node:
# ansible-playbook tests/admin-env.yml
# Needs the vault password (vault_password_file in ansible.cfg). Secrets are
# never printed: the assertions only name the keys that fail.
---
- name: Test the admin role's environment templates
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    env_role_dir: "{{ playbook_dir }}/../roles/admin"
    # Each app's template and the vault files the role includes for it.
    # Backend and stream use the same variable names, so each is rendered
    # with its own vault files only.
    env_apps:
      app-backend: [env_vault_backend.yaml]
      app-showcase: [env_vault_showcase.yaml]
      app-stream: [env_vault_stream.yaml, env_vault_redis.yaml]
    # Keys every Rails app reads
    env_required_keys:
      - APP_HOSTNAME
      - POSTGRESQL_DB
      - POSTGRESQL_HOST
      - POSTGRESQL_PASSWORD
      - POSTGRESQL_PORT
      - POSTGRESQL_USERNAME
      - RAILS_MASTER_KEY
      - SECRET_KEY_BASE
  tasks:
    - name: Load the vault files
      ansible.builtin.include_vars:
        file: "{{ env_role_dir }}/vars/{{ item }}"
        name: "env_vault_{{ item | regex_replace('^env_vault_|\\.yaml$', '') }}"
      loop: "{{ env_apps.values() | flatten | union(['env_vault_postgresql.yaml', 'env_vault_backup.yaml']) }}"
      no_log: true

    - name: Render the templates
      vars:
        env_vars: >-
          {{ item.value | map('regex_replace', '^env_vault_(.*)\.yaml$', 'env_vault_\1')
             | map('extract', vars) | combine }}
        env_text: "{{ lookup('template', env_role_dir ~ '/templates/' ~ item.key ~ '.env.j2', template_vars=env_vars) }}"
      ansible.builtin.set_fact:
        env_rendered: "{{ env_rendered | default({}) | combine({item.key: env_text}) }}"
      loop: "{{ env_apps | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      no_log: true

    - name: Parse the rendered files
      vars:
        env_lines: "{{ item.value.splitlines() | reject('match', '^\\s*(#|$)') | list }}"
        env_pairs: "{{ env_lines | map('regex_findall', '^([A-Z][A-Z0-9_]*)=\"([^\"]+)\"$') | select | map('first') | list }}"
        env_item:
          bad: "{{ env_lines | reject('match', '^[A-Z][A-Z0-9_]*=\"[^\"]+\"$') | map('regex_replace', '=.*', '') | list }}"
          keys: "{{ env_lines | map('regex_replace', '=.*', '') | list }}"
          env: "{{ env_pairs | community.general.dict }}"
      ansible.builtin.set_fact:
        env_parsed: "{{ env_parsed | default({}) | combine({item.key: env_item}) }}"
      loop: "{{ env_rendered | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      no_log: true

    - name: Check every line is KEY="value", without empty values
      ansible.builtin.assert:
        that: env_parsed[item].bad == []
        fail_msg: "{{ item }}: malformed or empty {{ env_parsed[item].bad }}"
        quiet: true
      loop: "{{ env_apps.keys() }}"

    - name: Check no key is set twice
      ansible.builtin.assert:
        that: env_parsed[item]['keys'] | unique | length == env_parsed[item]['keys'] | length
        fail_msg: "{{ item }}: duplicate keys"
        quiet: true
      loop: "{{ env_apps.keys() }}"

    - name: Check the keys every Rails app needs are there
      ansible.builtin.assert:
        that: env_required_keys | difference(env_parsed[item]['keys']) == []
        fail_msg: "{{ item }}: missing {{ env_required_keys | difference(env_parsed[item]['keys']) }}"
        quiet: true
      loop: "{{ env_apps.keys() }}"

    # The Postgres password is stored in several vault files: they must agree
    - name: Check the apps log in to Postgres with its user and password
      ansible.builtin.assert:
        that:
          - env_parsed[item].env.POSTGRESQL_USERNAME == env_vault_postgresql.postgres_user
          - env_parsed[item].env.POSTGRESQL_PASSWORD == env_vault_postgresql.postgres_password
        fail_msg: "{{ item }}: POSTGRESQL_USERNAME/PASSWORD differ from env_vault_postgresql.yaml"
        quiet: true
      loop: "{{ env_apps.keys() }}"
      no_log: true

    # The web registration site (app-showcase) encrypts the payloads for the
    # backend and authenticates with the backend's registration token
    - name: Check app-showcase and app-backend share the web registration secrets
      ansible.builtin.assert:
        that:
          - env_parsed['app-showcase'].env.WEB_REGISTRATION_ENCRYPTION_KEY == env_parsed['app-backend'].env.WEB_REGISTRATION_ENCRYPTION_KEY
          - env_parsed['app-showcase'].env.NGINX_WEB_REGISTRATION_TOKEN == env_parsed['app-backend'].env.WEB_REGISTRATION_API_TOKEN
        fail_msg: "app-showcase's WEB_REGISTRATION_ENCRYPTION_KEY or NGINX_WEB_REGISTRATION_TOKEN differ from app-backend's"
        quiet: true
      no_log: true

    - name: Check redis and app-stream share the redis password
      vars:
        env_redis: "{{ lookup('template', env_role_dir ~ '/templates/redis.env.j2', template_vars=env_vault_redis) | trim }}"
      ansible.builtin.assert:
        that: env_redis == 'REDIS_PASSWORD=' ~ env_parsed['app-stream'].env.REDIS_PASSWORD
        fail_msg: "redis.env and app-stream's REDIS_PASSWORD differ"
        quiet: true
      no_log: true

    # postgresql-backup PUTs each dump to "$URL/postgresql/<file>?$SAS":
    # the URL is the container's alone, the SAS the token alone (the portal's
    # "Blob SAS URL" in backup_azure_url broke the uploads once). The asserts
    # print their messages, never the values: no no_log, so failures read
    - name: Check the backup URL is an Azure container URL, without a query
      ansible.builtin.assert:
        that: env_vault_backup.backup_azure_url is match('^https://[a-z0-9]{3,24}\\.blob\\.core\\.windows\\.net/[a-z0-9-]{3,63}$')
        fail_msg: "backup_azure_url must be https://<account>.blob.core.windows.net/<container>, nothing after it"
        quiet: true

    - name: Check the backup SAS is a token that can create blobs and hasn't expired
      vars:
        env_sas: "{{ env_vault_backup.backup_azure_sas }}"
        env_sas_fields: "{{ env_sas.split('&') | map('split', '=', 1) | community.general.dict }}"
      ansible.builtin.assert:
        that:
          - env_sas is not match('^\\?')
          - env_sas_fields.sig is defined
          - env_sas_fields.sv is defined
          - env_sas_fields.sp | default('') is search('[cw]')
          - (env_sas_fields.se | default('1970-01-01'))[:10] | to_datetime('%Y-%m-%d') > now(utc=true)
        fail_msg: >-
          backup_azure_sas must be the SAS token alone (no leading ?, with sv=, sp= including c or w,
          sig=) and not expired: create one on the backup container
        quiet: true

    - name: Check the backup SAS doesn't expire within 30 days
      vars:
        env_sas_fields: "{{ env_vault_backup.backup_azure_sas.split('&') | map('split', '=', 1) | community.general.dict }}"
        env_sas_days: "{{ ((env_sas_fields.se[:10] | to_datetime('%Y-%m-%d')) - now(utc=true)).days }}"
      ansible.builtin.assert:
        that: env_sas_days | int >= 30
        fail_msg: "backup_azure_sas expires in {{ env_sas_days }} days: renew it, or the nightly uploads fail"
        quiet: true
