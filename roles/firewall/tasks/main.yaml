# firewall: ufw denies incoming traffic except from the allowed sources.
# Calico and kube-proxy chains run before ufw's, so pod, hostPort and
# NodePort traffic is not filtered here.
---
- name: Keep SSH open, since rules that are not listed get removed
  tags: firewall
  assert:
    that: 22 in firewall_allowed_ports
    fail_msg: firewall_allowed_ports must include 22, or Ansible locks itself out

- name: Install ufw
  tags: firewall
  apt:
    name: ufw
    state: present

- name: Allow ports from the allowed sources
  tags: firewall
  community.general.ufw:
    rule: allow
    direction: in
    from_ip: "{{ item.0 }}"
    to_port: "{{ item.1 | string }}"
  loop: "{{ firewall_allowed_sources | product(firewall_allowed_ports) | list }}"

- name: List the ufw rules
  tags: firewall
  command: ufw show added
  register: firewall_added
  changed_when: false
  check_mode: false

# Any rule not built from the allowed sources and ports above is removed
- name: Remove the rules that are not listed
  tags: firewall
  command: "ufw delete {{ item | regex_replace('^ufw ', '') }}"
  loop: "{{ firewall_added.stdout_lines | select('match', '^ufw ') | difference(firewall_expected_rules) }}"
  vars:
    firewall_expected_rules: >-
      {{ firewall_allowed_sources | product(firewall_allowed_ports)
         | map('join', ' to any port ') | map('regex_replace', '^', 'ufw allow from ') | list }}

- name: Deny incoming and routed traffic by default
  tags: firewall
  community.general.ufw:
    direction: "{{ item }}"
    default: deny
  loop:
    - incoming
    - routed

- name: Allow outgoing traffic by default
  tags: firewall
  community.general.ufw:
    direction: outgoing
    default: allow

- name: Log blocked packets
  tags: firewall
  community.general.ufw:
    logging: low

# Enabled last, once the SSH rule is in place
- name: Enable ufw
  tags: firewall
  community.general.ufw:
    state: enabled
