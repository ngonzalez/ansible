---
# Hosts allowed to reach the node, and the ports they may use.
# Only ports served by the node itself belong here (SSH, the Kubernetes API,
# the kubelet...): Calico and kube-proxy route the Kubernetes services'
# traffic before ufw sees it, so a rule for one of their ports has no effect.
firewall_allowed_sources:
  - 192.168.1.11
firewall_allowed_ports:
  - 22
