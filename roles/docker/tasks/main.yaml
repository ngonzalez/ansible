# docker
---
- name: Add the docker apt repository key
  tags: docker
  get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /usr/share/keyrings/docker.asc
    mode: "0644"
    force: true

# Docker only publishes stable Debian releases, not testing/unstable (forky)
- name: Add the docker apt repository
  tags: docker
  copy:
    dest: /etc/apt/sources.list.d/docker.list
    mode: "0644"
    content: >
      deb [arch={{ docker_arch[ansible_architecture] }} signed-by=/usr/share/keyrings/docker.asc]
      https://download.docker.com/linux/debian {{ docker_debian_codename }} stable

# Replaced by the .asc key above
- name: Remove the dearmored docker key
  tags: docker
  file:
    path: /usr/share/keyrings/docker.gpg
    state: absent

- name: Install docker
  tags: docker
  apt:
    name:
      - docker-ce
      - containerd.io
    update_cache: true

- name: Add docker group
  tags: docker
  user:
    name: root
    group: docker

- name: Remove swapfile from /etc/fstab
  tags: docker
  mount:
    name: "{{ item }}"
    fstype: swap
    state: absent
  with_items:
    - swap
    - none

- name: Disable swap
  tags: docker
  command: swapoff -a
  when: ansible_swaptotal_mb > 0

- name: Start docker
  tags: docker
  service:
    name: docker
    state: restarted
    daemon_reload: true
