# docker
---
- name: Add docker apt key
  tags: docker
  shell: curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor --yes -o /usr/share/keyrings/docker.gpg

# Docker only publishes stable Debian releases, not testing/unstable (forky)
- name: Add docker apt repository
  tags: docker
  shell: echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker.gpg] https://download.docker.com/linux/debian {{ docker_debian_codename }} stable" | sudo tee /etc/apt/sources.list.d/docker.list

- name: Install docker
  tags: docker
  apt:
    name:
    - docker-ce
    - containerd.io

- name: Add docker group
  tags: docker
  user:
    name: root
    group: docker

- name: Remove swapfile from /etc/fstab
  tags: docker
  mount:
    name: "{{ item }}"
    fstype: swap
    state: absent
  with_items:
    - swap
    - none

- name: Disable swap
  tags: docker
  command: swapoff -a
  when: ansible_swaptotal_mb > 0

- name: Start docker
  tags: docker
  service:
    name: docker
    state: restarted
    daemon_reload: yes
