# Container Runtime Interface
---
- name: Add the CRI-O apt repository key
  tags: crio
  get_url:
    url: https://download.opensuse.org/repositories/isv:/cri-o:/stable:/{{ crio_version }}/deb/Release.key
    dest: /etc/apt/keyrings/cri-o-apt-keyring.asc
    mode: "0644"
    force: true

- name: Add the CRI-O apt repository
  tags: crio
  copy:
    dest: /etc/apt/sources.list.d/cri-o.list
    mode: "0644"
    content: |
      deb [signed-by=/etc/apt/keyrings/cri-o-apt-keyring.asc] https://download.opensuse.org/repositories/isv:/cri-o:/stable:/{{ crio_version }}/deb/ /

# Replaced by the .asc key above
- name: Remove the dearmored CRI-O key
  tags: crio
  file:
    path: /etc/apt/keyrings/cri-o-apt-keyring.gpg
    state: absent

- name: Install CRI-O
  tags: crio
  apt:
    name:
      - cri-o
    state: latest
    update_cache: true

- name: Add bridge configuration
  tags: crio
  template:
    src: cni.conf.j2
    dest: /etc/cni/net.d/100-cni.conf

# CRI-O, the kubelet, Alloy and Loki each hold inotify instances: with the
# default of 128 CRI-O fails to start with "too many open files", and
# `journalctl -f` reports "Insufficient watch descriptors"
- name: Set fs.inotify.max_user_instances
  tags: [crio, kernel]
  ansible.posix.sysctl:
    name: fs.inotify.max_user_instances
    sysctl_file: /etc/sysctl.d/90-crio.conf
    reload: true
    state: present
    sysctl_set: true
    value: 8192

- name: Start CRI-O
  tags: crio
  service:
    name: crio
    state: restarted
    daemon_reload: true
