---
# git
- name: Add github to known_hosts
  tags: always
  lineinfile:
    line: "{{ lookup('pipe', 'ssh-keyscan -t rsa github.com') }}"
    dest: "/root/.ssh/known_hosts"
    mode: "0644"
    owner: root
    create: true

- name: Checkout admin repository
  tags: always
  git:
    repo: "{{ admin_repository }}"
    dest: "{{ admin_path }}"
    version: dev

# namespace
- name: Create development namespace
  tags: admin
  command:
    chdir: "{{ admin_path }}"
    cmd: kubectl apply -f namespace/development.yaml

# Cloudflare Origin certificate for appshare.site and *.appshare.site, mounted
# by the nginx deployments
- name: Include vault tls
  tags: [admin, tls]
  include_vars: env_vault_tls.yaml
  no_log: true

- name: Create TLS certificate temporary file
  tags: [admin, tls]
  copy:
    content: "{{ tls_certificate }}"
    dest: /tmp/tls.crt
    mode: "0600"
  no_log: true

- name: Create TLS key temporary file
  tags: [admin, tls]
  copy:
    content: "{{ tls_private_key }}"
    dest: /tmp/tls.key
    mode: "0600"
  no_log: true

- name: Create TLS secret
  tags: [admin, tls]
  shell:
    cmd: >-
      kubectl -n development create secret tls appshare-site-tls --cert=/tmp/tls.crt --key=/tmp/tls.key
      --dry-run=client -o yaml | kubectl -n development apply -f -

- name: Remove TLS temporary files
  tags: [admin, tls]
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/tls.crt
    - /tmp/tls.key

# prometheus-community charts
- name: Add prometheus-community repository
  tags: [admin, prometheus]
  shell:
    chdir: "{{ admin_path }}"
    cmd: helm repo add --force-update prometheus-community https://prometheus-community.github.io/helm-charts && helm repo update prometheus-community

# prometheus
- name: Install prometheus
  tags: [admin, prometheus]
  command:
    chdir: "{{ admin_path }}"
    cmd: helm upgrade --install -f helm/prometheus.yaml prometheus prometheus-community/prometheus --version 29.35.0 --namespace development

- name: Set prometheus service external IP
  tags: [admin, prometheus]
  shell:
    chdir: "{{ admin_path }}"
    cmd: kubectl -n development patch svc prometheus-server -p '{"spec":{"externalIPs":["{{ apiserver_advertise_address }}"]}}'

# metrics-server
- name: Add metrics-server repository
  tags: [admin, metrics-server]
  shell:
    chdir: "{{ admin_path }}"
    cmd: helm repo add --force-update metrics-server https://kubernetes-sigs.github.io/metrics-server/ && helm repo update metrics-server

- name: Install metrics-server
  tags: [admin, metrics-server]
  command:
    chdir: "{{ admin_path }}"
    cmd: helm upgrade --install -f helm/metrics-server.yaml metrics-server metrics-server/metrics-server --version 3.14.0 --namespace kube-system

# postgresql
- name: Include vault postgresql
  tags: [admin, postgresql]
  include_vars: env_vault_postgresql.yaml
  # no_log: True

- name: Check for previous deployments of postgresql
  tags: [admin, postgresql]
  register: admin_postgresql_deployment
  shell:
    chdir: "{{ admin_path }}"
    cmd: kubectl -n development get statefulsets -o json | jq -r '.items[].spec.template.spec.containers[].name' | grep ^postgresql || true

- name: Create postgresql configmap
  tags: [admin, postgresql]
  shell:
    cmd: |
      cat <<EOF | kubectl apply -f -
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: postgresql-env
          namespace: development
          labels:
            app: postgresql
        data:
          POSTGRES_DB: {{ postgres_db }}
          POSTGRES_USER: {{ postgres_user }}
          POSTGRES_PASSWORD: {{ postgres_password }}
      EOF
  when: admin_postgresql_deployment.stdout == ""

- name: Create postgresql persistent volume
  tags: [admin, postgresql]
  command:
    chdir: "{{ admin_path }}"
    cmd: kubectl -n development apply -f storage/persistent-volume.yaml
  when: admin_postgresql_deployment.stdout == ""

- name: Create postgresql persistent volume claim
  tags: [admin, postgresql]
  command:
    chdir: "{{ admin_path }}"
    cmd: kubectl -n development apply -f storage/persistent-volume-claim.yaml
  when: admin_postgresql_deployment.stdout == ""

- name: Create postgresql deployment
  tags: [admin, postgresql]
  command:
    chdir: "{{ admin_path }}"
    cmd: kubectl -n development replace --force -f statefulset/postgresql.yaml
  when: admin_postgresql_deployment.stdout == ""

- name: Create postgresql loadbalancer
  tags: [admin, postgresql]
  command:
    chdir: "{{ admin_path }}"
    cmd: kubectl -n development replace --force -f service/postgresql.yaml
  when: admin_postgresql_deployment.stdout == ""

- name: Set postgresql service external IP
  tags: [admin, postgresql]
  shell:
    chdir: "{{ admin_path }}"
    cmd: kubectl -n development patch svc postgresql-svc -p '{"spec":{"externalIPs":["{{ apiserver_advertise_address }}"]}}'
  when: admin_postgresql_deployment.stdout == ""

# prometheus-postgres-exporter
- name: Include vault postgresql for prometheus-postgres-exporter
  tags: [admin, prometheus]
  include_vars: env_vault_postgresql.yaml
  no_log: true

- name: Create prometheus-postgres-exporter password secret
  tags: [admin, prometheus]
  no_log: true
  shell:
    cmd: >-
      kubectl -n development create secret generic prometheus-postgres-exporter-password
      --from-literal=password='{{ postgres_password }}' --dry-run=client -o yaml | kubectl -n development
      apply -f -

- name: Install prometheus-postgres-exporter
  tags: [admin, prometheus]
  command:
    chdir: "{{ admin_path }}"
    cmd: >-
      helm upgrade --install -f helm/prometheus-postgres-exporter.yaml prometheus-postgres-exporter
      prometheus-community/prometheus-postgres-exporter --version 7.0.0 --namespace development

- name: Set prometheus-postgres-exporter service external IP
  tags: [admin, prometheus]
  shell:
    chdir: "{{ admin_path }}"
    cmd: kubectl -n development patch svc prometheus-postgres-exporter -p '{"spec":{"externalIPs":["{{ apiserver_advertise_address }}"]}}'

