# loki
- name: Create loki data directory
  tags: [admin, loki]
  file:
    path: /data/loki
    state: directory
    owner: "10001"
    group: "10001"
    mode: "0750"

- name: Create loki persistent volume
  tags: [admin, loki]
  command:
    chdir: "{{ admin_path }}"
    cmd: kubectl apply -f storage/loki-persistent-volume.yaml

# The gateway's login: htpasswd of ~/.config/loki-credentials on the admin
# machine (user:password). Not stored here: create it once with
#   htpasswd -nbB <user> <password> | kubectl -n development create secret generic loki-gateway-auth --from-file=.htpasswd=/dev/stdin
#   IFS=: read -r u p < ~/.config/loki-credentials || [ -n "$p" ]; htpasswd -nbB "$u" "$p" | ssh root@192.168.1.14 kubectl -n development create secret generic loki-gateway-auth --from-file=.htpasswd=/dev/stdin
- name: Check the loki gateway login secret exists
  tags: [admin, loki]
  command: kubectl -n development get secret loki-gateway-auth
  changed_when: false

- name: Install loki
  tags: [admin, loki]
  command:
    chdir: "{{ admin_path }}"
    cmd: helm upgrade --install -f helm/loki.yaml loki grafana/loki --version 7.3.0 --namespace development

# Only the gateway (login required) is reachable from outside the cluster;
# Alloy and Grafana use the loki service inside it
- name: Set loki gateway service external IP
  tags: [admin, loki]
  shell:
    chdir: "{{ admin_path }}"
    cmd: kubectl -n development patch svc loki-gateway -p '{"spec":{"externalIPs":["{{ apiserver_advertise_address }}"]}}'

