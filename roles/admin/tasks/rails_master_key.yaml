---
# Read RAILS_MASTER_KEY from the CI/CD variables of the GitLab project
# gitlab_project, with the read_api token of env_vault_gitlab.yaml. The variable
# must be masked but not hidden: the API never returns a hidden value.
- name: Include vault gitlab
  include_vars: env_vault_gitlab.yaml
  no_log: True

- name: Read RAILS_MASTER_KEY from {{ gitlab_project }}
  no_log: True
  set_fact:
    rails_master_key: "{{ (lookup('ansible.builtin.url', 'https://gitlab.com/api/v4/projects/' ~ (gitlab_project | replace('/', '%2F')) ~ '/variables/RAILS_MASTER_KEY', headers={'PRIVATE-TOKEN': gitlab_api_token}, split_lines=False) | from_json).value }}"

- name: Check RAILS_MASTER_KEY from {{ gitlab_project }}
  assert:
    that: rails_master_key | length > 0
    fail_msg: "RAILS_MASTER_KEY of {{ gitlab_project }} is empty: make it masked, not hidden"
    quiet: True
