# Kubernetes
---
- name: Load kernel module overlay
  tags: kubernetes
  community.general.modprobe:
    name: overlay
    state: present

- name: Load kernel module br_netfilter
  tags: kubernetes
  community.general.modprobe:
    name: br_netfilter
    state: present

- name: Set net.bridge.bridge-nf-call-iptables
  tags: kubernetes
  ansible.posix.sysctl:
    name: net.bridge.bridge-nf-call-iptables
    reload: true
    state: present
    sysctl_set: true
    value: 1

- name: Set net.bridge.bridge-nf-call-ip6tables
  tags: kubernetes
  ansible.posix.sysctl:
    name: net.bridge.bridge-nf-call-ip6tables
    reload: true
    state: present
    sysctl_set: true
    value: 1

- name: Set net.ipv4.ip_forward
  tags: kubernetes
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    reload: true
    state: present
    sysctl_set: true
    value: 1

- name: Add the kubernetes apt repository key
  tags: kubernetes
  get_url:
    url: https://pkgs.k8s.io/core:/stable:/{{ kube_version }}/deb/Release.key
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    mode: "0644"
    force: true

- name: Add the kubernetes apt repository
  tags: kubernetes
  copy:
    dest: /etc/apt/sources.list.d/kubernetes.list
    mode: "0644"
    content: |
      deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/{{ kube_version }}/deb/ /

# Replaced by the .asc key above
- name: Remove the dearmored kubernetes key
  tags: kubernetes
  file:
    path: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    state: absent

- name: Install binaries
  tags: kubernetes
  apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: latest
    update_cache: true

- name: Reset cluster
  tags: kubernetes
  command: kubeadm reset -f --cri-socket {{ kube_cri_socket }}

- name: Pull images
  tags: kubernetes
  command: kubeadm config images pull --cri-socket {{ kube_cri_socket }}

- name: Initialize cluster
  tags: kubernetes
  # add --ignore-preflight-errors=all to skip the preflight checks
  command: >-
    kubeadm init
    --apiserver-advertise-address {{ apiserver_advertise_address }}
    --cri-socket {{ kube_cri_socket }}
    --pod-network-cidr {{ kube_pod_network_cidr }}
    --node-name {{ node_name }}

- name: Create .kube folder
  tags: kubernetes
  file:
    path: /root/.kube
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy configuration file with owner and permissions
  tags: kubernetes
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    owner: root
    group: root
    mode: "0400"
    remote_src: true

- name: Taint node as control-plane
  tags: kubernetes
  command: kubectl taint nodes --all node-role.kubernetes.io/control-plane-

# helm
- name: Check if Helm exists
  tags: kubernetes
  stat:
    path: /usr/local/bin/helm
  register: kube_helm_exists
  ignore_errors: true
  no_log: true

- name: Download Helm
  tags: kubernetes
  unarchive:
    src: https://get.helm.sh/helm-canary-linux-amd64.tar.gz
    dest: /tmp
    remote_src: true
  when: not kube_helm_exists.stat.exists

- name: Install Helm
  tags: kubernetes
  copy:
    src: /tmp/linux-amd64/helm
    dest: /usr/local/bin/helm
    mode: "0751"
    remote_src: true
  when: not kube_helm_exists.stat.exists

# tigera-operator
- name: Create Tigera Operator Namespace
  tags: kubernetes
  command: kubectl create ns tigera-operator

- name: Add Calico Repository
  tags: kubernetes
  command: helm repo add projectcalico https://projectcalico.docs.tigera.io/charts

- name: Install Tigera Operator
  tags: kubernetes
  command: helm upgrade --install calico projectcalico/tigera-operator --version v3.30.2 --namespace tigera-operator

# dns
- name: Add config for coredns
  tags: kubernetes
  shell:
    cmd: |
      cat <<EOF | kubectl apply -f -
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: coredns
          namespace: kube-system
        data:
          Corefile: |
            .:53 {
                errors
                health {
                    lameduck 5s
                }
                ready
                # link12.ddns.net is the node: pods resolve it without depending on
                # the No-IP record (which lapses) or on a hairpin through the router
                hosts {
                    {{ apiserver_advertise_address }} link12.ddns.net
                    fallthrough
                }
                kubernetes cluster.local in-addr.arpa ip6.arpa {
                    pods insecure
                    fallthrough in-addr.arpa ip6.arpa
                    ttl 30
                }
                prometheus :9153
                forward . /etc/resolv.conf
                cache 30
                loop
                reload
                loadbalance
            }
      EOF

- name: Set kube-dns service external IP
  tags: kubernetes
  command: kubectl -n kube-system patch svc kube-dns -p '{"spec":{"externalIPs":["{{ apiserver_advertise_address }}"]}}'

# debug
- name: Check if node exists
  tags: kubernetes
  command: kubectl get node {{ node_name }}
  register: kube_node_exists
  ignore_errors: true
  no_log: true

- name: Debug
  tags: kubernetes
  debug:
    var: kube_node_exists
